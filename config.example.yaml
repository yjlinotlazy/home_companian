font: /usr/share/fonts/adobe-source-han-sans/SourceHanSansCN-Regular.otf
fonts:
  思源黑体: /usr/share/fonts/adobe-source-han-sans/SourceHanSansCN-Regular.otf
  霞鹜文楷: /usr/share/fonts/TTF/LXGWWenKai-Medium.ttf
latin_font: /usr/share/fonts/TTF/CaskaydiaCoveNerdFont-Regular.ttf
latin_fonts:
  Caskaydia Cove Nerd Font: /usr/share/fonts/TTF/CaskaydiaCoveNerdFont-Regular.ttf
  JetBrains Mono Nerd Font: /usr/share/fonts/TTF/JetBrainsMonoNerdFont-Regular.ttf
  Noto Sans Mono: /usr/share/fonts/noto/NotoSansMono-Regular.ttf
  霞鹜文楷: /usr/share/fonts/TTF/LXGWWenKai-Medium.ttf
  思源黑体: /usr/share/fonts/adobe-source-han-sans/SourceHanSansCN-Regular.otf
library_dir: library.example
default_device: wall_panel
reward: {id: toy, name: 玩具, cost: 50, initial_points: 25}
checklists:
  person_1: [1, 2, 3]
  person_2: [6, 7, 8]
  family: [4, 5]

channels:
  home:
    mode: scheduled
    schedule:
      - {time: "12:00", item: 1}
      - {time: "13:00", item: 2}
    random_items: [1, 2, 3]

devices:
  wall_panel:
    profile: crowpanel_579
    channel: home
    refresh:
      schedule:
        - {start: "08:00", end: "12:00", profile: mixed}
        - {start: "12:00", end: "17:00", profile: dashboard_only}
        - {start: "17:00", end: "20:00", profile: mixed}
    presentation:
      status_bar:
        left: []
        center:
          - module: solar_term
        right:
          - module: weekday
      panels:
        dashboard:
          template: landscape_3
          slots:
            1: {module: images, collections: "plants,animals"}
            2: {module: items}
            3: {module: chinese, source: select}
        chinese_character:
          template: landscape_1
          slots:
            1: {module: chinese_characters}
        chinese_poem:
          template: landscape_1
          slots:
            1: {module: language, type: chinese_poem}
        fill_words:
          template: landscape_1
          slots:
            1: {module: language, type: fill_words}
        pinyin:
          template: landscape_1
          slots:
            1: {module: language, type: pinyin}
        math_game24:
          template: landscape_1
          slots:
            1: {module: math, type: game24}
        math_pattern:
          template: landscape_1
          slots:
            1: {module: math, type: pattern}
        images:
          template: landscape_1
          slots:
            1: {module: images, collections: "plants,animals"}
        tasks:
          template: landscape_1
          slots:
            1: {module: items}
      display_profiles:
        # panels 可写成“面板: 百分比”；同一 profile 下总和必须为 100。
        mixed:
          minutes: 20
          panels: {chinese_character: 25, chinese_poem: 20, fill_words: 10, pinyin: 10, math_game24: 8, math_pattern: 7, images: 10, tasks: 10}
        dashboard_only: {minutes: 40, panels: {dashboard: 100}}
  kindleGen7dk:
    profile: kindle_6_167ppi_landscape
    channel: home
    refresh:
      minutes: 30
      active_start: "07:00"
      active_end: "22:00"
    presentation:
      status_bar:
        left:
          - module: solar_term
        center: []
        right:
          - module: weekday
      panel:
        template: landscape_6
        slots:
          1: {module: checklist, group: person_1}
          2: {module: checklist, group: person_2, reward: toy}
          3: {module: images, directory: /path/to/family-album, frame: "true"}
