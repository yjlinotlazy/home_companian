[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-companian"
version = "0.1.0"
description = "Server-side renderer for a household e-paper companion"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "PyYAML>=6",
]

[project.scripts]
home-companian = "home_companian.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_companian = ["template_data/*.yaml"]
